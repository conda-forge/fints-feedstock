schema_version: 1

context:
  name: fints
  version: 5.0.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fints-${{ version }}.tar.gz
  sha256: 2799e447c7940152ace67bd8984e17deec31cf4461e46f90ad6b12271a64b6ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - bleach
    - requests
    - sepaxml >=2.7,<3.dev0
    - enum_tools >=0.12.0,<0.13.dev0
    - lxml >=6.0.2,<7
    - mt940
tests:
  - python:
      imports:
        - fints
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: FinTS client library for Python
  description: |
    Many operations in FinTS will require a form of two-step
    authentication, called TANs. TANs are mostly required for operations
    that move money or change details of a bank account. TANs can be
    generated with a multitude of methods, including paper lists,
    smartcard readers, SMS messages, and smartphone apps.
  homepage: https://python-fints.readthedocs.io
  repository: https://github.com/raphaelm/python-fints
  documentation: https://python-fints.readthedocs.io

extra:
  recipe-maintainers:
    - jan-janssen
